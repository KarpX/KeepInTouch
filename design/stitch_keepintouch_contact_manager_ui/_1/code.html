</div>
<!-- Segmented Tab Switcher -->

<span class="material-symbols-outlined text-[18px]">login</span>
          Вход
        </button>
<button class="flex-1 py-space-xs rounded-lg font-body-semibold text-body-sm transition-all duration-200 text-on-surface-variant hover:text-on-surface flex items-center justify-center gap-space-xs" id="tab-register" onclick="switchAuthTab('register')" type="button">
<span class="material-symbols-outlined text-[18px]">person_add</span>

</div>
<!-- Form Container -->
<form class="flex flex-col gap-space-md" id="auth-form" onsubmit="event.preventDefault();">
<!-- Registration Only Field: Name -->

<span class="">Ваше имя</span>
</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-space-md text-outline text-[20px] pointer-events-none">badge</span>
<input class="w-full pl-11 pr-space-md py-2.5 bg-surface-container-low hover:bg-surface-container rounded-lg font-body-base text-body-base text-on-surface placeholder:text-outline focus:outline-none focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary/20 transition-all duration-150" id="name" placeholder="Константин Лебедев" type="text">
</div>
</div>

<div class="flex flex-col gap-space-xs">

</label>

<span class="material-symbols-outlined absolute left-space-md text-outline text-[20px] pointer-events-none">alternate_email</span>
<input class="w-full pl-11 pr-space-md py-2.5 bg-surface-container-low hover:bg-surface-container rounded-lg font-body-base text-body-base text-on-surface placeholder:text-outline focus:outline-none focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary/20 transition-all duration-150" id="identity" placeholder="name@domain.ru или +7 900..." type="text">

<button aria-label="Переключить видимость пароля" class="absolute right-space-md text-outline hover:text-on-surface transition-colors flex items-center justify-center p-1 rounded-full" onclick="togglePasswordVisibility('password', this)" type="button">

</button>

<!-- Registration Only Field: Confirm Password -->

</div>

</div>
<script>
  function switchAuthTab(type) {
    const isLogin = type === 'login';
    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    const fieldName = document.getElementById('field-name');
    const fieldConfirmPassword = document.getElementById('field-confirm-password');
    const rememberMeContainer = document.getElementById('remember-me-container');
    const forgotPasswordLink = document.getElementById('forgot-password-link');
    const termsContainer = document.getElementById('terms-container');
    const submitBtnText = document.getElementById('submit-btn-text');

    if (isLogin) {
      // Styles for Login Tab active
      tabLogin.className = 'flex-1 py-space-xs rounded-lg font-body-semibold text-body-sm transition-all duration-200 bg-surface-container-lowest text-primary shadow-sm flex items-center justify-center gap-space-xs';
      tabRegister.className = 'flex-1 py-space-xs rounded-lg font-body-semibold text-body-sm transition-all duration-200 text-on-surface-variant hover:text-on-surface flex items-center justify-center gap-space-xs';
      
      fieldName.classList.add('hidden');
      fieldName.classList.remove('flex');
      fieldConfirmPassword.classList.add('hidden');
      fieldConfirmPassword.classList.remove('flex');
      
      rememberMeContainer.classList.remove('hidden');
      rememberMeContainer.classList.add('flex');
      forgotPasswordLink.classList.remove('hidden');
      termsContainer.classList.add('hidden');

      submitBtnText.textContent = 'Войти в аккаунт';
    } else {
      // Styles for Register Tab active
      tabRegister.className = 'flex-1 py-space-xs rounded-lg font-body-semibold text-body-sm transition-all duration-200 bg-surface-container-lowest text-primary shadow-sm flex items-center justify-center gap-space-xs';
      tabLogin.className = 'flex-1 py-space-xs rounded-lg font-body-semibold text-body-sm transition-all duration-200 text-on-surface-variant hover:text-on-surface flex items-center justify-center gap-space-xs';
      
      fieldName.classList.remove('hidden');
      fieldName.classList.add('flex');
      fieldConfirmPassword.classList.remove('hidden');
      fieldConfirmPassword.classList.add('flex');
      
      rememberMeContainer.classList.add('hidden');
      rememberMeContainer.classList.remove('flex');
      forgotPasswordLink.classList.add('hidden');
      termsContainer.classList.remove('hidden');

      submitBtnText.textContent = 'Создать аккаунт';
    }
  }

  function togglePasswordVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    const icon = btn.querySelector('.material-symbols-outlined');
    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility';
    }
  }
</script></main>
